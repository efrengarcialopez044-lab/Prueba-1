<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;color:#2B2622;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;padding:20mm 18mm;position:relative;page-break-after:always;background:#FBF8F2;overflow:hidden}
.pg:last-child{page-break-after:auto}
.serif{font-family:'Fraunces',Georgia,serif}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0}
.ante{font-size:9.5pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5E6E52;margin:0 0 4mm}
.pie{position:absolute;left:18mm;right:18mm;bottom:10mm;display:flex;justify-content:space-between;font-size:8.5pt;color:#8B8178}
p{line-height:1.5;font-size:11pt;margin:0 0 3mm}
.caja{border:1.4pt solid #8A9A7B;border-radius:2mm;width:6mm;height:6mm;flex:none;background:#fff}
.lista{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4.5mm}
.lista li{display:flex;gap:4mm;align-items:flex-start;font-size:12pt;line-height:1.4}
.tarjeta{background:#F1EADD;border-radius:5mm;padding:7mm}
.linea{border-bottom:1pt solid #D9CFBF;height:9mm}
.cover{background:#5E6E52;color:#F6F1E7;display:flex;flex-direction:column;justify-content:space-between;padding:26mm 22mm}
.terra{color:#A9502F}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3mm}
.cal div{background:#fff;border:1pt solid #E4DACA;border-radius:3mm;height:38mm;padding:3mm;font-size:8.5pt;gap:1.5mm;line-height:1.3;display:flex;flex-direction:column;justify-content:space-between}
.cal b{font-family:'Fraunces',serif;font-size:15pt;font-weight:500;color:#A9502F}
.sem{font-size:10pt;font-weight:600;color:#5E6E52;margin:6mm 0 3mm;text-transform:uppercase;letter-spacing:.1em}
</style></head><body>
<div id="root"></div>
<script>
const D=[
['El cajón de los trastos','Empezamos por algo pequeño para ganar impulso. Un solo cajón, de principio a fin.',['Saca todo el contenido y ponlo sobre una toalla.','Tira lo roto, lo seco y lo que no sabes qué es.','Agrupa lo que queda: pilas, bolis, cargadores, llaves…','Limpia el cajón por dentro con un paño húmedo.','Vuelve a meter solo lo que usas, cada grupo junto.'],'Saca 5 cosas que no deberían estar ahí y llévalas a su sitio.'],
['La encimera de la cocina','La encimera despejada cambia toda la cocina. Hoy dejamos solo lo que usas a diario.',['Retira todo lo que no sea de uso diario.','Lleva cada cosa a su sitio o a la caja de “dudas”.','Limpia la superficie a fondo, también detrás de los aparatos.','Deja fuera un máximo de 3 o 4 objetos.','Decide una “zona prohibida” que siempre estará libre.'],'Despeja un metro de encimera y límpialo.'],
['El recibidor y la entrada','Es lo primero que ves al llegar. Que te reciba con calma.',['Recoge zapatos, bolsas y papeles del suelo.','Deja a mano solo el calzado de esta temporada.','Vacía el cuenco o bandeja de llaves y monedas.','Pon un gancho o una caja para lo que entra y sale cada día.','Pasa un paño por el mueble y la puerta.'],'Coloca los zapatos en pares y retira lo que no es de la entrada.'],
['La mesita de noche','Dormir junto al orden se nota. Deja solo lo que te ayuda a descansar.',['Vacía la superficie y el cajón.','Tira envoltorios, tiques y bolis que no escriben.','Devuelve libros, vasos y tazas a su sitio.','Quédate con lo imprescindible: lámpara, libro, crema, cargador.','Limpia el polvo y coloca solo esos objetos.'],'Retira todo lo que no uses por la noche.'],
['El sofá y la mesa del salón','La zona donde descansas. Hoy la recuperamos para ti.',['Recoge mantas y cojines y dóblalos.','Busca debajo de los cojines y del sofá.','Vacía la mesa: mandos, revistas, tazas, juguetes.','Pon una bandeja para los mandos y lo de uso diario.','Limpia la mesa y deja una sola cosa decorativa.'],'Despeja la mesa del salón y dobla las mantas.'],
['Papeles y correo','El montón de papeles es uno de los grandes ladrones de calma. Hoy lo desmontamos.',['Reúne todos los papeles sueltos de la casa en un solo sitio.','Separa en tres montones: pagar o hacer, guardar, tirar.','Rompe y recicla todo lo que sobra.','Pon lo de “pagar o hacer” en una carpeta visible.','Guarda lo importante en una carpeta por temas.'],'Recicla la publicidad y los sobres vacíos.'],
['El bolso y la mochila','Cerramos la primera semana con lo que llevas encima cada día.',['Vacía el bolso o la mochila del todo.','Tira tiques, envoltorios y pañuelos usados.','Guarda las monedas y revisa la cartera.','Mete solo lo esencial, cada cosa en su bolsillo.','Repite con la mochila de los niños o la bolsa del gimnasio.'],'Saca la basura y los tiques del bolso.'],
['La nevera','Empezamos la semana de cocina y baño. Una nevera ordenada también ahorra dinero.',['Saca todo y tira lo caducado o pasado.','Limpia baldas y cajones con agua y vinagre.','Agrupa por tipos: lácteos, sobras, verdura, salsas.','Pon delante lo que caduca antes.','Haz una lista rápida de lo que falta.'],'Tira lo caducado y limpia una balda.'],
['La despensa','Ver lo que tienes evita comprar dos veces lo mismo.',['Saca todo de una balda o armario cada vez.','Tira lo caducado y junta los paquetes abiertos repetidos.','Agrupa: desayuno, pasta y arroz, latas, aperitivos.','Usa botes o cajas para lo que va suelto.','Pon a la vista lo que hay que gastar primero.'],'Revisa fechas de una sola balda.'],
['Armarios de la cocina: menaje','Platos, vasos y tápers sin pareja: hoy sobran.',['Saca los tápers y empareja cada uno con su tapa.','Recicla los que no tienen pareja o están rotos.','Revisa vasos y tazas: quédate con los que usas.','Pon lo de uso diario a la altura de la mano.','Lo que usas poco, arriba o al fondo.'],'Empareja tápers y tapas y recicla los sueltos.'],
['Debajo del fregadero','La zona que nadie quiere mirar. Diez minutos y listo.',['Saca todo y limpia la base del armario.','Junta los productos repetidos y tira los vacíos.','Comprueba que no haya humedad ni fugas.','Usa una caja o cesta para agrupar los productos.','Deja a mano solo lo que usas cada semana.'],'Tira los botes vacíos y limpia la base.'],
['El armario del baño','Cremas a medias, muestras y medicinas antiguas: hoy hacemos limpieza.',['Saca todo de un estante o cajón.','Tira lo caducado y las muestras que nunca usas.','Lleva las medicinas caducadas al punto SIGRE de tu farmacia.','Agrupa: cara, cuerpo, pelo, botiquín.','Coloca delante lo que usas cada día.'],'Revisa fechas y tira lo caducado.'],
['Ducha y bañera','Menos botes, más calma al ducharte.',['Retira todos los botes de la ducha.','Tira los vacíos y junta los repetidos.','Limpia las superficies y las esquinas.','Vuelve a poner solo un bote de cada tipo.','Guarda el resto como reserva en el armario.'],'Retira los botes vacíos de la ducha.'],
['Toallas y ropa de cama','Cerramos la segunda semana con el armario de la ropa de casa.',['Saca todas las toallas y juegos de sábanas.','Aparta las que están rotas o desgastadas para trapos o donación.','Calcula lo que necesitas: dos juegos por cama y dos toallas por persona.','Dobla y guarda cada juego dentro de una de sus fundas.','Etiqueta las baldas si lo comparte toda la familia.'],'Aparta tres toallas o sábanas que ya no usas.'],
['Zapatos','Empieza la última semana: armarios y zonas grandes. Hoy, el calzado.',['Saca todos los zapatos y ponlos en pares.','Aparta los que hacen daño, están rotos o no te pones.','Guarda los de otra temporada en una caja.','Coloca a mano los que usas cada semana.','Limpia el zapatero o el suelo del armario.'],'Saca dos pares que no te pones y apártalos.'],
['Ropa: camisetas y tops','Una balda cada vez. Sin prisas, sin culpa.',['Saca todas las camisetas y tops.','Pregúntate: ¿me lo he puesto este año? ¿me queda bien?','Usa las 3 cajas: me lo quedo, lo dono, lo tiro.','Dobla en vertical para verlo todo de un vistazo.','Guarda solo lo que te encanta y usas.'],'Aparta cinco prendas para donar.'],
['Ropa: pantalones y faldas','Seguimos con el armario, ahora la parte de abajo.',['Saca todos los pantalones, faldas y vestidos.','Pruébate lo que dudes: si no te queda bien hoy, fuera.','Aplica las 3 cajas.','Cuelga o dobla por tipos y colores.','Deja un hueco libre: un armario lleno no se mantiene.'],'Pruébate tres prendas dudosas y decide.'],
['Abrigos y bolsos','Lo que cuelga en la entrada y en el armario.',['Reúne abrigos, chaquetas y bolsos.','Revisa los bolsillos y vacíalos.','Quédate con un abrigo de cada tipo que de verdad uses.','Guarda los de otra temporada en fundas o cajas.','Dona lo que esté en buen estado y no te pongas.'],'Vacía los bolsillos de tus abrigos.'],
['Juguetes o zona de hobbies','Tanto si hay niños como si no: la zona donde se acumulan las cosas “de hacer”.',['Saca todo de una caja o estantería.','Tira lo roto y lo que tiene piezas perdidas.','Aparta lo que ya no se usa para regalar o donar.','Agrupa por tipos en cajas abiertas y fáciles de recoger.','Si hay niños, hazlo con ellos: así aprenden dónde va cada cosa.'],'Llena una bolsa con cosas para donar.'],
['Productos de limpieza','Penúltimo día. Prepara tu “kit” para mantener la casa con poco esfuerzo.',['Junta todos los productos de limpieza de la casa.','Tira los vacíos y junta los repetidos.','Quédate con lo básico: multiusos, baño, cocina, suelos, vinagre.','Prepara una cesta con lo básico que puedas llevar de una habitación a otra.','Guarda la reserva en un solo sitio.'],'Prepara tu cesta de limpieza básica.'],
['Repaso final y foto del después','¡Lo has conseguido! Hoy celebramos y dejamos el hábito en marcha.',['Da una vuelta por la casa y apunta lo que más ha cambiado.','Haz una foto de tus zonas favoritas: tu “después”.','Lleva las cajas de donación a su destino.','Elige tus 3 hábitos de mantenimiento (página siguiente).','Date un premio: te lo has ganado.'],'Haz la foto del después y saca las bolsas de donación.']
];
const S=['Semana 1 · Zonas rápidas','Semana 2 · Cocina y baño','Semana 3 · Armarios y zonas grandes'];
const pie=(n)=>`<div class="pie"><span>Reto de 21 días para ordenar tu casa</span><span>${n}</span></div>`;
let h='';let n=1;
h+=`<section class="pg cover"><div><p style="font-size:10pt;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin:0 0 6mm">Reto</p><p class="serif" style="font-size:150pt;line-height:.85;margin:0">21</p><h1 style="font-size:34pt;font-style:italic;line-height:1.1;margin-top:4mm">días para ordenar tu casa</h1></div><div><div style="width:22mm;height:1.6mm;background:#C0623F;border-radius:1mm;margin-bottom:8mm"></div><p style="font-size:14pt;margin:0">10 minutos al día. Una checklist por día. Cero agobios.</p></div></section>`;
n++;
h+=`<section class="pg"><p class="ante">Antes de empezar</p><h2 style="font-size:30pt;margin-bottom:8mm">Cómo usar este reto</h2>
<div style="display:flex;flex-direction:column;gap:6mm">${[['1','Una zona al día','Cada página es un día. Haz solo lo de ese día, aunque te queden ganas de más.'],['2','10 minutos con temporizador','Pon el temporizador del móvil. Cuando suene, para. Lo importante es la constancia, no la perfección.'],['3','Las 3 cajas','Ten a mano tres cajas o bolsas: me lo quedo, lo dono, lo tiro. Encontrarás el método en la página 25.'],['4','¿Día complicado?','Usa la versión exprés de 5 minutos que hay en cada checklist. Cuenta igual.'],['5','Si te saltas un día','No pasa nada. Retómalo al día siguiente donde lo dejaste. El reto no caduca.']].map(x=>`<div class="tarjeta" style="display:flex;gap:6mm;align-items:flex-start"><span class="serif terra" style="font-size:26pt;line-height:1">${x[0]}</span><div><h3 style="font-size:15pt;margin-bottom:2mm">${x[1]}</h3><p style="margin:0">${x[2]}</p></div></div>`).join('')}</div>
<p style="margin-top:8mm;font-size:10pt;color:#6B6159">Puedes imprimirlo en A4 o usarlo en el móvil o la tablet marcando las casillas con cualquier app de PDF.</p>${pie(n)}</section>`;
n++;
h+=`<section class="pg"><p class="ante">Tu calendario</p><h2 style="font-size:30pt;margin-bottom:4mm">21 días, de lo fácil a lo grande</h2><p>Pégalo en la nevera y tacha cada día que completes.</p>${S.map((s,w)=>`<p class="sem">${s}</p><div class="cal">${D.slice(w*7,w*7+7).map((d,i)=>`<div><b>${w*7+i+1}</b><span>${d[0]}</span><span class="caja" style="width:5mm;height:5mm"></span></div>`).join('')}</div>`).join('')}${pie(n)}</section>`;
D.forEach((d,i)=>{n++;const w=Math.floor(i/7);
h+=`<section class="pg"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8mm"><div><p class="ante">${S[w]}</p><h2 style="font-size:28pt;line-height:1.1;max-width:120mm">${d[0]}</h2></div><div style="text-align:center;background:#5E6E52;color:#F6F1E7;border-radius:5mm;padding:4mm 6mm"><span style="font-size:8pt;letter-spacing:.15em;text-transform:uppercase">Día</span><br><span class="serif" style="font-size:34pt;line-height:1">${i+1}</span></div></div>
<p style="font-size:12pt;color:#5C534B;margin-bottom:8mm">${d[1]}</p>
<div class="tarjeta" style="margin-bottom:7mm"><p style="font-weight:600;margin-bottom:5mm">Checklist · 10 minutos</p><ul class="lista">${d[2].map(x=>`<li><span class="caja"></span><span>${x}</span></li>`).join('')}</ul></div>
<div style="border:1.2pt dashed #C0623F;border-radius:5mm;padding:5mm 7mm;margin-bottom:8mm;display:flex;gap:5mm;align-items:center"><span class="caja" style="border-color:#C0623F"></span><p style="margin:0"><strong class="terra">Versión exprés (5 min):</strong> ${d[3]}</p></div>
<p style="font-weight:600;margin-bottom:2mm">Notas</p><div class="linea"></div><div class="linea"></div><div class="linea"></div>
<div style="display:flex;gap:10mm;margin-top:8mm;align-items:center;font-size:11pt"><span>¿Cómo me siento hoy?</span>${['Igual','Mejor','¡Genial!'].map(x=>`<span style="display:flex;gap:2mm;align-items:center"><span class="caja" style="border-radius:50%"></span>${x}</span>`).join('')}</div>${pie(n)}</section>`;});
n++;
h+=`<section class="pg"><p class="ante">Herramienta</p><h2 style="font-size:30pt;margin-bottom:6mm">El método de las 3 cajas</h2><p style="margin-bottom:8mm">Ten siempre tres cajas o bolsas a mano mientras ordenas. Cada objeto que tocas va a una de ellas. Sin dejarlo “para luego”.</p>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-bottom:10mm">${[['Me lo quedo','Lo uso, me gusta y tiene un sitio.','#5E6E52'],['Lo dono','Está en buen estado, pero ya no lo uso.','#C0623F'],['Lo tiro','Está roto, caducado o no le sirve a nadie.','#2B2622']].map(c=>`<div style="border-radius:5mm;padding:7mm 5mm;background:${c[2]};color:#F6F1E7;height:58mm;display:flex;flex-direction:column;justify-content:space-between"><h3 style="font-size:17pt">${c[0]}</h3><p style="margin:0;font-size:10.5pt">${c[1]}</p></div>`).join('')}</div>
<div class="tarjeta"><p style="font-weight:600;margin-bottom:4mm">Si dudas, hazte estas preguntas:</p><ul class="lista">${['¿Lo he usado en el último año?','Si lo viera hoy en una tienda, ¿lo compraría?','¿Lo tengo repetido?','¿Lo guardo por culpa o por compromiso?'].map(x=>`<li><span class="caja"></span><span>${x}</span></li>`).join('')}</ul><p style="margin:5mm 0 0;font-size:10.5pt;color:#5C534B">¿Sigues dudando? Guárdalo en una caja con la fecha de hoy. Si en tres meses no lo has abierto, ya sabes la respuesta.</p></div>${pie(n)}</section>`;
n++;
h+=`<section class="pg"><p class="ante">Después del reto</p><h2 style="font-size:30pt;margin-bottom:6mm">Plan para mantenerlo</h2><p style="margin-bottom:7mm">El orden se mantiene con hábitos pequeños, no con grandes limpiezas. Elige tres y márcalos durante dos semanas.</p>
<div style="display:flex;flex-direction:column;gap:4mm">${[['Reset de la noche','5 minutos antes de dormir: cada cosa a su sitio.'],['Uno entra, uno sale','Si entra una prenda o un objeto nuevo, sale otro.'],['La encimera libre','Nunca te vas a dormir con la encimera llena.'],['El correo al momento','Los papeles se abren y se deciden el mismo día.'],['Repaso del domingo','15 minutos para revisar la zona que más se desordena.'],['La caja de donación','Una caja fija en casa: cuando se llena, se lleva.']].map(x=>`<div style="display:flex;gap:5mm;align-items:center;background:#fff;border:1pt solid #E4DACA;border-radius:4mm;padding:4mm 5mm"><span class="caja"></span><div style="flex:1"><strong style="font-size:12pt">${x[0]}</strong><br><span style="font-size:10pt;color:#5C534B">${x[1]}</span></div><div style="display:flex;gap:1.6mm">${Array.from({length:14}).map(()=>'<span style="width:4.2mm;height:4.2mm;border-radius:50%;border:1pt solid #8A9A7B"></span>').join('')}</div></div>`).join('')}</div>
<p style="margin-top:8mm;font-size:10pt;color:#6B6159">Gracias por hacer el reto. Si te ha ayudado, nos encantaría que nos lo contaras.</p>${pie(n)}</section>`;
document.getElementById('root').innerHTML=h;
</script></body></html>
