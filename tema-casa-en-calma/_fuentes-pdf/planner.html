<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;color:#2B2622;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;padding:20mm 18mm;position:relative;page-break-after:always;background:#FBF8F2;overflow:hidden}
.pg:last-child{page-break-after:auto}
.serif{font-family:'Fraunces',Georgia,serif}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0}
.ante{font-size:9.5pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5E6E52;margin:0 0 4mm}
.pie{position:absolute;left:18mm;right:18mm;bottom:10mm;display:flex;justify-content:space-between;font-size:8.5pt;color:#8B8178}
p{line-height:1.5;font-size:11pt;margin:0 0 3mm}
.caja{border:1.4pt solid #8A9A7B;border-radius:2mm;width:6mm;height:6mm;flex:none;background:#fff}
.lista{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4.5mm}
.lista li{display:flex;gap:4mm;align-items:flex-start;font-size:12pt;line-height:1.4}
.tarjeta{background:#F1EADD;border-radius:5mm;padding:7mm}
.linea{border-bottom:1pt solid #D9CFBF;height:9mm}
.cover{background:#5E6E52;color:#F6F1E7;display:flex;flex-direction:column;justify-content:space-between;padding:26mm 22mm}
.terra{color:#A9502F}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3mm}
.cal div{background:#fff;border:1pt solid #E4DACA;border-radius:3mm;height:38mm;padding:3mm;font-size:8.5pt;gap:1.5mm;line-height:1.3;display:flex;flex-direction:column;justify-content:space-between}
.cal b{font-family:'Fraunces',serif;font-size:15pt;font-weight:500;color:#A9502F}
.sem{font-size:10pt;font-weight:600;color:#5E6E52;margin:6mm 0 3mm;text-transform:uppercase;letter-spacing:.1em}
</style></head><body>
<div id="root"></div>
<script>
const pie=(n)=>`<div class="pie"><span>Planner de limpieza semanal</span><span>${n}</span></div>`;
const W=[['Lunes','Cocina',['Encimera y fregadero','Frontal de los electrodomésticos','Barrer el suelo']],['Martes','Baño',['Lavabo y espejo','Inodoro','Ducha o bañera']],['Miércoles','Dormitorios',['Cambiar sábanas','Quitar el polvo','Aspirar']],['Jueves','Salón',['Quitar el polvo de muebles','Ordenar mesa y sofá','Aspirar alfombras']],['Viernes','Suelos',['Aspirar toda la casa','Fregar los suelos','Vaciar papeleras']],['Sábado','Ropa',['Poner lavadoras','Doblar y guardar','Planchar lo imprescindible']],['Domingo','Descanso y plan',['Repaso de 15 min','Lista de la compra','Revisar la semana']]];
const DI=['Hacer las camas','Fregar o cargar el lavavajillas','Limpiar la encimera después de cenar','Reset de 5 minutos antes de dormir','Recoger lo que está fuera de su sitio'];
const M=['Limpiar el interior de la nevera','Limpiar el horno y el microondas','Lavar cortinas y fundas de cojines','Limpiar cristales y marcos','Descalcificar grifos y alcachofa de la ducha','Revisar la despensa y fechas','Limpiar el polvo de lámparas y rodapiés','Lavar almohadas y edredones (cambio de estación)'];
let h='',n=1;
h+=`<section class="pg cover" style="background:#C0623F"><div><p style="font-size:10pt;letter-spacing:.2em;text-transform:uppercase;opacity:.9;margin:0 0 8mm">Complemento del reto</p><h1 style="font-size:52pt;line-height:1.02">Planner de limpieza <em>semanal</em></h1></div><div><div style="width:22mm;height:1.6mm;background:#F6F1E7;border-radius:1mm;margin-bottom:8mm"></div><p style="font-size:14pt;margin:0">Tu casa limpia con tareas de 15 minutos al día.</p></div></section>`;
n++;h+=`<section class="pg"><p class="ante">Tu semana tipo</p><h2 style="font-size:30pt;margin-bottom:4mm">Una zona por día</h2><p style="margin-bottom:6mm">Cada día te ocupas de una zona en unos 15 minutos. Así nunca se acumula y el fin de semana es para ti.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4mm">${W.map(d=>`<div class="tarjeta" style="padding:5mm 6mm"><p style="margin:0 0 1mm;font-size:9pt;letter-spacing:.12em;text-transform:uppercase;color:#5E6E52;font-weight:600">${d[0]}</p><h3 style="font-size:16pt;margin-bottom:3mm">${d[1]}</h3><ul class="lista" style="gap:2.5mm">${d[2].map(x=>`<li style="font-size:10.5pt"><span class="caja" style="width:5mm;height:5mm"></span>${x}</li>`).join('')}</ul></div>`).join('')}</div>${pie(n)}</section>`;
for(let k=0;k<2;k++){n++;h+=`<section class="pg"><p class="ante">Plantilla para imprimir</p><h2 style="font-size:26pt;margin-bottom:3mm">Semana del ____ al ____</h2><p style="margin-bottom:5mm;color:#5C534B">Imprime una hoja por semana o úsala en la tablet.</p><div style="display:flex;flex-direction:column;gap:3mm">${W.map(d=>`<div style="display:grid;grid-template-columns:32mm 1fr;gap:4mm;background:#fff;border:1pt solid #E4DACA;border-radius:4mm;padding:3.5mm 5mm;align-items:center"><div><strong>${d[0]}</strong><br><span style="font-size:9.5pt;color:#5E6E52">${d[1]}</span></div><div style="display:flex;flex-direction:column;gap:2mm">${[0,1,2].map(()=>`<div style="display:flex;gap:3mm;align-items:center"><span class="caja" style="width:4.5mm;height:4.5mm"></span><span style="flex:1;border-bottom:1pt solid #E4DACA;height:5mm"></span></div>`).join('')}</div></div>`).join('')}</div>${pie(n)}</section>`;}
n++;h+=`<section class="pg"><p class="ante">Todos los días</p><h2 style="font-size:30pt;margin-bottom:6mm">Las 5 tareas diarias</h2><p style="margin-bottom:6mm">Cinco gestos pequeños que mantienen la casa a flote. Marca cada día de la semana.</p><div style="display:flex;flex-direction:column;gap:3.5mm">${DI.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;background:#fff;border:1pt solid #E4DACA;border-radius:4mm;padding:4mm 5mm"><span style="font-size:11.5pt">${x}</span><span style="display:flex;gap:2.5mm">${['L','M','X','J','V','S','D'].map(d=>`<span style="display:flex;flex-direction:column;align-items:center;font-size:7.5pt;color:#8B8178;gap:1mm">${d}<span class="caja" style="width:5mm;height:5mm"></span></span>`).join('')}</span></div>`).join('')}</div>
<p class="ante" style="margin-top:12mm">Una vez al mes o por temporada</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:3mm">${M.map(x=>`<div style="display:flex;gap:3mm;align-items:center;font-size:10.5pt"><span class="caja" style="width:5mm;height:5mm"></span>${x}</div>`).join('')}</div>${pie(n)}</section>`;
document.getElementById('root').innerHTML=h;
</script></body></html>
