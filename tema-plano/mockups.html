<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter Display','Inter',sans-serif;color:#1d1d1f;-webkit-font-smoothing:antialiased}
.stage{width:2000px;height:2000px;background:#f5f5f7;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage.wide{width:2400px;height:1400px}
.stage.white{background:#fff}
/* iPad */
.ipad{position:relative;width:1560px;height:1120px;border-radius:84px;background:#2c2c2e;padding:34px;
  box-shadow:0 0 0 3px #48484a inset,0 90px 140px -60px rgba(0,0,0,.35),0 40px 60px -40px rgba(0,0,0,.25)}
.ipad .scr{width:100%;height:100%;border-radius:52px;background:#fff;overflow:hidden;position:relative}
.ipad .cam{position:absolute;top:50%;left:14px;width:10px;height:10px;border-radius:50%;background:#111;transform:translateY(-50%)}
.pencil{position:absolute;width:1100px;height:34px;border-radius:17px;background:linear-gradient(#fff,#e8e8ed);
  box-shadow:0 30px 40px -20px rgba(0,0,0,.3);transform-origin:left center}
.pencil::after{content:'';position:absolute;right:-60px;top:0;border-left:60px solid #e8e8ed;border-top:17px solid transparent;border-bottom:17px solid transparent}
/* MacBook */
.mac{position:relative;display:flex;flex-direction:column;align-items:center}
.mac .lid{width:1680px;height:1060px;border-radius:44px 44px 0 0;background:#1d1d1f;padding:30px 30px 46px;box-shadow:0 0 0 3px #3a3a3c inset}
.mac .scr{width:100%;height:100%;border-radius:14px;background:#fff;overflow:hidden}
.mac .base{width:1960px;height:54px;background:linear-gradient(#e3e3e8,#c7c7cc);border-radius:0 0 34px 34px;position:relative;
  box-shadow:0 70px 100px -40px rgba(0,0,0,.35)}
.mac .base::before{content:'';position:absolute;left:50%;top:0;width:300px;height:18px;transform:translateX(-50%);background:#b6b6bb;border-radius:0 0 16px 16px}
/* iPhone */
.iphone{position:absolute;width:520px;height:1060px;border-radius:92px;background:#2c2c2e;padding:22px;box-shadow:0 0 0 3px #48484a inset,0 70px 110px -40px rgba(0,0,0,.4)}
.iphone .scr{width:100%;height:100%;border-radius:72px;background:#fff;overflow:hidden;position:relative}
.iphone .isla{position:absolute;top:26px;left:50%;transform:translateX(-50%);width:150px;height:44px;border-radius:22px;background:#000;z-index:2}

/* Planner UI */
.pl{display:flex;height:100%;font-size:22px}
.pl .main{flex:1;padding:56px 60px 48px 70px;display:flex;flex-direction:column}
.pl .tabs{width:72px;background:#f5f5f7;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px 0;border-left:1px solid #e5e5ea}
.pl .tabs span{display:block;text-align:center;font-size:20px;font-weight:600;color:#86868b;padding:10px 0}
.pl .tabs span.on{color:#fff;background:#0071e3;border-radius:12px 0 0 12px;margin-left:8px}
.pl h2{font-size:64px;font-weight:700;letter-spacing:-.03em}
.pl h2 small{font-size:30px;font-weight:500;color:#86868b;letter-spacing:0;margin-left:16px}
.pl .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:34px}
.pl .chips{display:flex;gap:10px}
.pl .chips i{font-style:normal;font-size:20px;font-weight:600;padding:8px 18px;border-radius:999px;background:#f5f5f7;color:#6e6e73}
.pl .chips i.on{background:#1d1d1f;color:#fff}
.mes{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;flex:1;border-top:1px solid #e5e5ea;border-left:1px solid #e5e5ea}
.mes .dn{font-size:18px;font-weight:600;color:#86868b;padding:12px 14px;border-right:1px solid #e5e5ea;border-bottom:1px solid #e5e5ea;height:auto}
.mes div{border-right:1px solid #e5e5ea;border-bottom:1px solid #e5e5ea;padding:12px 14px;font-size:22px;font-weight:600;position:relative}
.mes div.off{color:#c7c7cc}
.ev{display:block;margin-top:8px;font-size:16px;font-weight:600;padding:5px 10px;border-radius:8px;background:#e8f2fd;color:#0062c4;white-space:nowrap;overflow:hidden}
.ev.g{background:#e9f7ee;color:#1f8a46}.ev.o{background:#fff1e5;color:#c25e00}.ev.p{background:#f3ecfd;color:#7a3fd1}
.hoy{display:inline-flex;width:40px;height:40px;border-radius:50%;background:#0071e3;color:#fff;align-items:center;justify-content:center;margin:-6px 0 0 -8px}
.mano{font-family:'Segoe Print','Comic Neue','Inter Display',cursive;font-style:italic;font-weight:500;color:#1d1d1f}
.sem{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:18px;flex:1}
.sem>div{background:#f5f5f7;border-radius:22px;padding:22px 24px}
.sem b{display:block;font-size:18px;color:#86868b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.sem b.hoyb{color:#0071e3}
.sem p{display:flex;align-items:center;gap:12px;font-size:20px;margin-bottom:12px;font-weight:500}
.sem p::before{content:'';width:22px;height:22px;border-radius:7px;border:2px solid #c7c7cc;flex:none}
.sem p.ok::before{background:#0071e3;border-color:#0071e3}
.sem p.ok{color:#86868b;text-decoration:line-through}
.hab{display:flex;flex-direction:column;gap:26px;flex:1;justify-content:center}
.hab .f{display:flex;align-items:center;gap:20px}
.hab .f span{width:230px;flex:none;font-size:22px;font-weight:600}
.hab .dots{display:flex;gap:7px}
.hab .dots i{width:23px;height:23px;border-radius:50%;background:#e5e5ea}
.hab .dots i.y{background:#0071e3}.hab .dots i.y2{background:#34c759}.hab .dots i.y3{background:#ff9f0a}.hab .dots i.y4{background:#af52de}
.racha{margin-top:20px;display:flex;justify-content:space-between;align-items:center;background:#f5f5f7;border-radius:22px;padding:24px 30px;font-size:22px;font-weight:600}
.racha strong{font-size:40px;letter-spacing:-.02em}
.anual{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 36px;flex:1}
.anual .m b{display:block;font-size:20px;margin-bottom:10px}
.anual .m b.on{color:#0071e3}
.anual .g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.anual .g i{aspect-ratio:1;border-radius:4px;background:#f2f2f5}
.anual .g i.x{background:#0071e3}.anual .g i.z{background:#d2e6fb}

/* Sheets UI */
.sh{height:100%;display:flex;flex-direction:column;font-size:20px;background:#fff}
.sh .bar{height:64px;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid #e5e5ea;background:#fbfbfd}
.sh .bar i{width:16px;height:16px;border-radius:50%;background:#ff5f57}.sh .bar i:nth-child(2){background:#febc2e}.sh .bar i:nth-child(3){background:#28c840}
.sh .bar span{margin-left:24px;font-weight:600;color:#6e6e73}
.sh .tabsb{display:flex;gap:6px;padding:14px 28px 0;border-bottom:1px solid #e5e5ea}
.sh .tabsb span{padding:12px 22px;font-weight:600;color:#86868b;border-radius:12px 12px 0 0}
.sh .tabsb span.on{background:#f5f5f7;color:#1d1d1f}
.sh .body{flex:1;padding:36px 44px;display:flex;flex-direction:column;gap:28px;background:#f5f5f7}
.sh h3{font-size:46px;letter-spacing:-.03em;font-weight:700}
.sh h3 small{font-size:24px;color:#86868b;font-weight:500;margin-left:12px;letter-spacing:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi{background:#fff;border-radius:22px;padding:24px 26px}
.kpi span{font-size:18px;color:#86868b;font-weight:600}
.kpi strong{display:block;font-size:44px;letter-spacing:-.03em;margin-top:6px}
.kpi.b strong{color:#0071e3}.kpi.v strong{color:#1f8a46}.kpi.r strong{color:#d70015}
.duo{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;flex:1}
.card{background:#fff;border-radius:22px;padding:26px 28px;display:flex;flex-direction:column}
.card h4{font-size:22px;margin-bottom:18px}
.cat{display:grid;grid-template-columns:200px 1fr 110px;align-items:center;gap:16px;margin-bottom:16px;font-weight:600;font-size:19px}
.cat .t{height:14px;border-radius:7px;background:#f2f2f5;overflow:hidden}
.cat .t i{display:block;height:100%;border-radius:7px;background:#0071e3}
.cat .t i.r{background:#ff3b30}
.cat em{font-style:normal;text-align:right;color:#6e6e73}
.donut{width:300px;height:300px;border-radius:50%;margin:10px auto 18px;background:conic-gradient(#0071e3 0 50%,#34c759 50% 80%,#ff9f0a 80% 100%);position:relative}
.donut::after{content:'';position:absolute;inset:62px;border-radius:50%;background:#fff}
.donut b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font-size:30px;flex-direction:column}
.donut b small{font-size:16px;color:#86868b}
.ley{display:flex;justify-content:center;gap:22px;font-size:17px;font-weight:600;color:#6e6e73}
.ley i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:20px}
th{text-align:left;color:#86868b;font-weight:600;font-size:17px;padding:12px 14px;border-bottom:1px solid #e5e5ea}
td{padding:15px 14px;border-bottom:1px solid #f2f2f5;font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pill{font-size:16px;font-weight:600;padding:5px 12px;border-radius:999px;background:#e8f2fd;color:#0062c4}
.pill.g{background:#e9f7ee;color:#1f8a46}.pill.o{background:#fff1e5;color:#c25e00}.pill.p{background:#f3ecfd;color:#7a3fd1}
.bars{flex:1;display:flex;align-items:flex-end;gap:18px;padding-top:10px}
.bars div{flex:1;display:flex;gap:5px;align-items:flex-end;height:100%;position:relative}
.bars i{flex:1;border-radius:8px 8px 3px 3px;background:#0071e3}
.bars i.g{background:#d2d2d7}
.bars span{position:absolute;bottom:-34px;left:0;right:0;text-align:center;font-size:16px;color:#86868b;font-weight:600}
.prog{height:22px;border-radius:11px;background:#f2f2f5;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#0071e3,#40a0ff);border-radius:11px}
/* phone sheet */
.ph{padding:110px 34px 30px;height:100%;background:#f5f5f7;font-size:20px}
.ph h5{font-size:40px;letter-spacing:-.03em;margin-bottom:6px}
.ph p.s{color:#86868b;font-weight:600;margin-bottom:26px}
.ph .kpi{margin-bottom:16px}
.ph .mov{background:#fff;border-radius:22px;padding:8px 22px}
.ph .mov div{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #f2f2f5;font-weight:600}
.ph .mov div:last-child{border:0}
.ph .mov em{font-style:normal;color:#86868b;font-size:16px;display:block;font-weight:500}
.tag{position:absolute;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-radius:28px;padding:26px 34px;font-size:28px;font-weight:600;box-shadow:0 30px 60px -30px rgba(0,0,0,.3)}
.tag small{display:block;font-size:20px;color:#86868b;font-weight:500;margin-top:4px}
</style></head>
<body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search);const v=Q.get('v');
const tabs=(on)=>'<div class="tabs">'+['2027','E','F','M','A','M','J','J','A','S','O','N','D'].map((t,i)=>`<span class="${i===on?'on':''}">${t}</span>`).join('')+'</div>';
function mensual(){let d=['L','M','X','J','V','S','D'].map(x=>`<div class="dn">${x}</div>`).join('');
 const ev={3:['Dentista','p'],9:['Cumple Ana','o'],12:['Entrega',''],17:['Yoga','g'],19:['Viaje','o'],20:['Viaje','o'],24:['Cena',''],29:['Pagar luz','p']};
 for(let i=0;i<35;i++){const n=i+1;if(n>31){d+=`<div class="off">${n-31}</div>`;continue}
  d+=`<div>${n===17?'<span class="hoy">17</span>':n}${ev[n]?`<span class="ev ${ev[n][1]}">${ev[n][0]}</span>`:''}</div>`}
 return `<div class="pl"><div class="main"><div class="head"><h2>Marzo<small>2027</small></h2><div class="chips"><i>Año</i><i class="on">Mes</i><i>Semana</i><i>Día</i></div></div><div class="mes">${d}</div></div>${tabs(3)}</div>`}
function semanal(){const D=[['Lun 15',['Yoga 8:00','Enviar propuesta'],[1]],['Mar 16',['Llamar a mamá','Comprar flores'],[0]],['Mié 17',['Dentista 17h','Leer 20 min'],[],1],['Jue 18',['Reunión equipo','Gimnasio'],[]],['Vie 19',['Entregar proyecto'],[]],['Sáb 20',['Brunch con Ana','Mercado'],[]],['Dom 21',['Descanso total'],[]]];
 let h=D.map(([t,ts,ok,hoy])=>`<div><b class="${hoy?'hoyb':''}">${t}</b>${ts.map((x,i)=>`<p class="${ok.includes(i)?'ok':''}">${x}</p>`).join('')}</div>`).join('');
 h+=`<div><b>Notas</b><p class="mano" style="font-size:22px">Idea: viaje a Lisboa en mayo ✈︎</p></div>`;
 return `<div class="pl"><div class="main"><div class="head"><h2>Semana 11<small>15 – 21 marzo</small></h2><div class="chips"><i>Año</i><i>Mes</i><i class="on">Semana</i><i>Día</i></div></div><div class="sem">${h}</div></div>${tabs(3)}</div>`}
function habitos(){const H=[['Leer 20 min','y',24],['Beber 2 L de agua','y2',27],['Caminar 30 min','y3',19],['Sin pantallas 23h','y4',15],['Meditar','y',22]];
 const f=H.map(([n,c,k])=>{let s='';for(let i=0;i<31;i++)s+=`<i class="${(i*7+k)%31<k&&i<26?c:''}"></i>`;return `<div class="f"><span>${n}</span><div class="dots">${s}</div></div>`}).join('');
 return `<div class="pl"><div class="main"><div class="head"><h2>Hábitos<small>Marzo 2027</small></h2><div class="chips"><i class="on">Mes</i><i>Año</i></div></div><div class="hab">${f}<div class="racha"><span>Racha más larga</span><strong>12 días</strong></div></div></div>${tabs(3)}</div>`}
function anual(){const M=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 const m=M.map((n,j)=>{let g='';for(let i=0;i<35;i++){const r=(i*13+j*7)%23;g+=`<i class="${r===0?'x':r===5||r===11?'z':''}"></i>`}return `<div class="m"><b class="${j===2?'on':''}">${n}</b><div class="g">${g}</div></div>`}).join('');
 return `<div class="pl"><div class="main"><div class="head"><h2>2027<small>Tu año de un vistazo</small></h2><div class="chips"><i class="on">Año</i><i>Mes</i><i>Semana</i></div></div><div class="anual">${m}</div></div>${tabs(0)}</div>`}

const shTabs=(on)=>'<div class="tabsb">'+['Panel','Gastos','Resumen anual','Deudas','Ahorro','Guía'].map((t,i)=>`<span class="${i===on?'on':''}">${t}</span>`).join('')+'</div>';
const shBar='<div class="bar"><i></i><i></i><i></i><span>Kit Finanzas 2027</span></div>';
function panel(){const C=[['Vivienda',78,'650 €'],['Comida',64,'312 €'],['Transporte',41,'96 €'],['Ocio',92,'138 €','r'],['Suscripciones',55,'33 €'],['Otros',30,'45 €']];
 return `<div class="sh">${shBar}${shTabs(0)}<div class="body"><h3>Marzo<small>Panel mensual</small></h3>
 <div class="kpis"><div class="kpi"><span>Ingresos</span><strong>2.150 €</strong></div><div class="kpi"><span>Gastado</span><strong>1.274 €</strong></div><div class="kpi b"><span>Te queda</span><strong>876 €</strong></div><div class="kpi v"><span>Ahorro</span><strong>21 %</strong></div></div>
 <div class="duo"><div class="card"><h4>Presupuesto por categoría</h4>${C.map(([n,p,e,r])=>`<div class="cat"><span>${n}</span><div class="t"><i class="${r||''}" style="width:${p}%"></i></div><em>${e}</em></div>`).join('')}</div>
 <div class="card"><h4>Regla 50/30/20</h4><div class="donut"><b>50/30/20<small>tu reparto</small></b></div><div class="ley"><span><i style="background:#0071e3"></i>Necesidades</span><span><i style="background:#34c759"></i>Deseos</span><span><i style="background:#ff9f0a"></i>Ahorro</span></div></div></div></div></div>`}
function gastos(){const R=[['02/03','Supermercado','Comida','',' 64,20 €'],['03/03','Abono transporte','Transporte','g','40,00 €'],['05/03','Cine','Ocio','o','18,50 €'],['07/03','Alquiler','Vivienda','p','650,00 €'],['09/03','Farmacia','Otros','','12,35 €'],['11/03','Streaming','Suscripciones','g','12,99 €'],['14/03','Cena fuera','Ocio','o','42,00 €'],['16/03','Mercado','Comida','','38,70 €'],['18/03','Gasolina','Transporte','g','56,00 €']];
 return `<div class="sh">${shBar}${shTabs(1)}<div class="body"><h3>Registro de gastos<small>Marzo 2027</small></h3><div class="card" style="flex:1"><table><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th style="text-align:right">Importe</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="pill ${r[3]}">${r[2]} ▾</span></td><td class="n">${r[4]}</td></tr>`).join('')}</table></div></div></div>`}
function anualf(){const M=['E','F','M','A','M','J','J','A','S','O','N','D'];const I=[80,78,82,80,85,84,90,70,82,86,84,95],G=[66,60,63,58,70,61,78,64,60,62,66,80];
 return `<div class="sh">${shBar}${shTabs(2)}<div class="body"><h3>2027<small>Resumen anual</small></h3><div class="kpis"><div class="kpi"><span>Ingresos del año</span><strong>25.800 €</strong></div><div class="kpi"><span>Gastos del año</span><strong>20.124 €</strong></div><div class="kpi b"><span>Ahorrado</span><strong>5.676 €</strong></div><div class="kpi v"><span>Tasa de ahorro</span><strong>22 %</strong></div></div>
 <div class="card" style="flex:1;padding-bottom:56px"><h4>Ingresos y gastos por mes <span class="pill" style="margin-left:12px">Ingresos</span> <span class="pill" style="background:#f2f2f5;color:#6e6e73">Gastos</span></h4><div class="bars">${M.map((m,i)=>`<div><i style="height:${I[i]}%"></i><i class="g" style="height:${G[i]}%"></i><span>${m}</span></div>`).join('')}</div></div></div></div>`}
function deudas(){const D=[['Tarjeta de crédito','1.200 €',72,'4 meses'],['Préstamo coche','4.800 €',35,'19 meses'],['Préstamo estudios','2.300 €',58,'9 meses']];
 return `<div class="sh">${shBar}${shTabs(3)}<div class="body"><h3>Plan para salir de deudas<small>Método bola de nieve</small></h3><div class="kpis"><div class="kpi"><span>Deuda total</span><strong>8.300 €</strong></div><div class="kpi"><span>Pago extra al mes</span><strong>150 €</strong></div><div class="kpi b"><span>Libre de deudas</span><strong>Oct 2028</strong></div><div class="kpi v"><span>Intereses ahorrados</span><strong>640 €</strong></div></div>
 <div class="card" style="flex:1;gap:18px">${D.map(d=>`<div><div style="display:flex;justify-content:space-between;font-weight:600;font-size:22px"><span>${d[0]}</span><span style="color:#86868b">${d[1]} · ${d[3]}</span></div><div class="prog"><i style="width:${d[2]}%"></i></div><small style="color:#86868b;font-weight:600">${d[2]} % pagado</small></div>`).join('')}</div></div></div>`}
function phone(){return `<div class="isla"></div><div class="ph"><h5>Marzo</h5><p class="s">Google Sheets · Panel</p><div class="kpi b"><span>Te queda este mes</span><strong>876 €</strong></div><div class="kpi v"><span>Tasa de ahorro</span><strong>21 %</strong></div><div class="mov"><div><span>Supermercado<em>Comida</em></span><span>64,20 €</span></div><div><span>Abono<em>Transporte</em></span><span>40,00 €</span></div><div><span>Cine<em>Ocio</em></span><span>18,50 €</span></div><div><span>Mercado<em>Comida</em></span><span>38,70 €</span></div></div></div>`}

const ipad=(s,st='')=>`<div class="ipad" style="${st}"><div class="cam"></div><div class="scr">${s}</div></div>`;
const mac=(s,st='')=>`<div class="mac" style="${st}"><div class="lid"><div class="scr">${s}</div></div><div class="base"></div></div>`;
const pencil=(x,y,r)=>`<div class="pencil" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"></div>`;
const V={
 'pl-1':()=>`<div class="stage">${ipad(mensual())}${pencil(520,1660,-3)}</div>`,
 'pl-2':()=>`<div class="stage">${ipad(semanal())}${pencil(520,1660,-3)}</div>`,
 'pl-3':()=>`<div class="stage">${ipad(habitos())}${pencil(520,1660,-3)}</div>`,
 'pl-4':()=>`<div class="stage">${ipad(anual())}${pencil(520,1660,-3)}</div>`,
 'fi-1':()=>`<div class="stage">${mac(panel(),'transform:scale(.96)')}<div class="iphone" style="right:40px;bottom:250px;transform:scale(.8);transform-origin:bottom right">${'<div class="scr">'+phone()+'</div>'}</div></div>`,
 'fi-2':()=>`<div class="stage">${mac(gastos(),'transform:scale(.96)')}</div>`,
